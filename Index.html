<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Flappy Mobile</title>
    <style>
        body { margin: 0; overflow: hidden; background: #70c5ce; position: fixed; width: 100%; height: 100%; }
        canvas { display: block; }
    </style>
</head>
<body>
<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Ajusta o tamanho para o celular
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let birdY = canvas.height / 2;
    let birdX = 50;
    let velocity = 0;
    let gravity = 0.4;
    let jump = -7;
    let score = 0;
    let frames = 0;
    let gameActive = true;
    const pipes = [];
    const pipeWidth = 60;
    const pipeGap = 160;

    // CONTROLE DE TOQUE E TECLADO
    function handleAction(e) {
        e.preventDefault(); // Evita o zoom/rolagem ao tocar
        if(gameActive) velocity = jump;
        else resetGame();
    }

    window.addEventListener("touchstart", handleAction, {passive: false});
    window.addEventListener("keydown", handleAction);

    function resetGame() {
        birdY = canvas.height / 2;
        velocity = 0;
        pipes.length = 0;
        score = 0;
        frames = 0;
        gameActive = true;
        loop();
    }

    function loop() {
        if (!gameActive) return;
        ctx.fillStyle = "#70c5ce";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        velocity += gravity;
        birdY += velocity;
        
        ctx.fillStyle = "yellow";
        ctx.fillRect(birdX, birdY, 30, 30);

        if (frames % 80 === 0) {
            let height = Math.random() * (canvas.height - pipeGap - 100) + 50;
            pipes.push({ x: canvas.width, top: height });
        }

        for (let i = pipes.length - 1; i >= 0; i--) {
            pipes[i].x -= 3;
            ctx.fillStyle = "#2e7d32";
            ctx.fillRect(pipes[i].x, 0, pipeWidth, pipes[i].top);
            ctx.fillRect(pipes[i].x, pipes[i].top + pipeGap, pipeWidth, canvas.height);

            if (birdX + 30 > pipes[i].x && birdX < pipes[i].x + pipeWidth) {
                if (birdY < pipes[i].top || birdY + 30 > pipes[i].top + pipeGap) gameOver();
            }
            if (pipes[i].x === birdX - 1) score++;
            if (pipes[i].x + pipeWidth < 0) pipes.splice(i, 1);
        }

        if (birdY + 30 > canvas.height || birdY < 0) gameOver();

        ctx.fillStyle = "white";
        ctx.font = "bold 30px Arial";
        ctx.fillText(score, canvas.width / 2, 50);
        frames++;
        requestAnimationFrame(loop);
    }

    function gameOver() {
        gameActive = false;
        ctx.fillStyle = "rgba(0,0,0,0.6)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "white";
        ctx.textAlign = "center";
        ctx.font = "bold 40px Arial";
        ctx.fillText("GAME OVER", canvas.width/2, canvas.height/2);
        ctx.font = "20px Arial";
        ctx.fillText("Toque para reiniciar", canvas.width/2, canvas.height/2 + 50);
    }

    loop();
</script>
</body>
</html>
